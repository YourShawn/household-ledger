server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: household-ledger
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:household_ledger}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:ledger}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:change-me-db}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

ledger:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-32bytes-min!!}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  cors:
    origins: ${LEDGER_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088}
  seed: ${LEDGER_SEED:true}
  public-base-url: ${LEDGER_PUBLIC_BASE_URL:http://localhost:5173}
  share-ttl-days: 90
  mail:
    from: ${MAIL_FROM:noreply@localhost}
  auto-send:
    cron: "0 */15 * * * *"

logging:
  level:
    com.householdledger: INFO
