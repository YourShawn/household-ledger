spring:
  datasource:
    url: jdbc:h2:mem:ledger;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

ledger:
  jwt:
    secret: test-secret-change-me-32-bytes-min
  seed: false
  cors:
    origins: http://localhost:5173
